[package]
name = "my-cloud"
version = "0.1.0"
edition = "2024"
authors = ["Po Co<me@polnio.dev>"]

[lib]
proc-macro = true

[dependencies]
derive-syn-parse = "0.2.0"
quote = "1.0.47"
syn = "3.0.3"

anyhow = "1.0.104"
argon2 = { version = "0.5.3", features = ["std"] }
clap = { version = "4.6.6", features = ["derive"] }
config = { version = "0.15.25", default-features = false, features = ["toml"] }
dirs = "6.0.0"
itertools = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

axum = { version = "0.8.9", default-features = false, optional = true }
bitflags = { version = "2.13.1", optional = true }
chrono = { version = "0.4.45", optional = true }
futures-util = { version = "0.3.34", optional = true }
headers = { version = "0.4.1", optional = true }
mime_guess = { version = "2.0.5", optional = true }
thiserror = { version = "2.0.20", optional = true }
tokio-util = { version = "0.7.19", optional = true }
tower = { version = "0.5.3", optional = true }
tower-http = { version = "0.7.0", optional = true }
walkdir = { version = "2.5.0", optional = true }
xml = { version = "1.4.0", optional = true }

[features]
default = ["webdav"]
webdav = [
  "dep:axum",
  "axum/http1",
  "axum/macros",
  "axum/tokio",

  "dep:bitflags",
  "dep:chrono",
  "dep:futures-util",
  "dep:headers",
  "dep:mime_guess",
  "dep:thiserror",

  "tokio/fs",

  "dep:tokio-util",
  "tokio-util/io",

  "dep:tower",

  "dep:tower-http",
  "tower-http/trace",

  "dep:walkdir",
  "dep:xml",
]
