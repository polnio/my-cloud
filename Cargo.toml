[package]
name = "my-cloud"
version = "0.1.0"
edition = "2024"
authors = ["Po Co<me@polnio.dev>"]

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.5.3", features = ["std"] }
clap = { version = "4.6.6", features = ["derive"] }
config = { version = "0.15.25", default-features = false, features = ["toml"] }
dav-server = { version = "0.11.0", optional = true }
dirs = "6.0.0"
futures-util = "0.3.33"
headers = "0.4.1"
hyper = { version = "1.11.0", optional = true }
hyper-util = { version = "0.1.20", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[features]
default = ["webdav"]
webdav = [
  "dep:dav-server",

  "dep:hyper",
  "hyper/server",
  "hyper/http1",

  "dep:hyper-util",
  "hyper-util/tokio"
]
